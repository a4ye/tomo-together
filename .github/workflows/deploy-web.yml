name: Deploy web app

# The web version is exported from the SAME src/ as the Android app on every
# push, so it always stays an exact clone — change code once, both update.
#
# The bundle is published to R2, where the tomo-together-api Worker serves
# app.tomo-together.com from. Files the new bundle does not contain are not
# deleted, so stale hashed assets linger harmlessly.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "App.tsx"
      - "index.ts"
      - "app.config.ts"
      - "app.json"
      - "plugins/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Export react-native-web build
        # EXPO_PUBLIC_* substitutions are Metro transforms, so clear the
        # persistent transform cache whenever producing a deployment bundle.
        run: npx expo export --clear --platform web --output-dir dist

      - name: Publish to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_PUBLISH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/r2-publish.mjs dist webapp
