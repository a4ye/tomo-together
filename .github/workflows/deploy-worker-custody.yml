name: Deploy custody Worker

# Crypto custody service. It holds treasury custody: the deploy is gated on a
# typecheck and followed by a readiness probe.

on:
  push:
    branches: [main]
    paths:
      - "custody/worker/**"
      - "migration/schema-custody.sql"
      - ".github/workflows/deploy-worker-custody.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-custody
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: custody/worker/package-lock.json

      - name: Install
        working-directory: custody/worker
        run: npm ci

      - name: Typecheck
        working-directory: custody/worker
        run: npm run typecheck

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: custody/worker
          # MUST stay pinned (SPEC section 7).
          wranglerVersion: "4.127.1"

      - name: Verify datastore readiness
        run: >-
          curl --fail --silent --show-error
          --retry 30 --retry-delay 10 --retry-max-time 300 --retry-all-errors
          "https://tomo-together-custody.cloudflare-disjoin783.workers.dev/ready"

      - name: Contract suite against the deployed Worker
        env:
          BASE_URL: https://tomo-together-custody.cloudflare-disjoin783.workers.dev
        working-directory: contract-tests
        run: node --test custody.contract.test.mjs
